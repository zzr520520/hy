name: Build Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV

    - name: Setup iOS SDK & ldid
      run: |
        git clone --quiet --depth=1 https://github.com/theos/sdks.git $THEOS/sdks
        brew install ldid

    - name: Compile Dylib
      run: |
        export THEOS=~/theos
        make package FINALPACKAGE=1
        echo "=== 查找编译产物 ==="
        find .theos -name "*.dylib" -type f

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WespyAudioEnhancer
        path: |
          .theos/obj/
          *.deb
